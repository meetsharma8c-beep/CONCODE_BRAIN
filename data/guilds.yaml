- name: api
  icon: "\U0001F50C"
  keywords:
  - api
  - rest
  - graphql
  - endpoint
  - openapi
  - route
  - webhook
  - middleware
  - swagger
  - fastapi
  - express
  - rate limit
  - pagination
  - versioning
  system_prompt: "You are CONCODE API \u2014 a backend API design and implementation\
    \ specialist. You build RESTful APIs, GraphQL schemas, WebSocket handlers, webhook\
    \ processors, and middleware chains using FastAPI, Express, Django REST, or NestJS.\
