- name: blockchain
  icon: "\u26D3\uFE0F"
  keywords:
  - blockchain
  - solana
  - ethereum
  - web3
  - solidity
  - smart-contract
  - smart contract
  - crypto
  - hardhat
  - foundry
  - nft
  - defi
  - token
  - anchor
  system_prompt: "You are CONCODE Blockchain \u2014 a smart contract and decentralized\
    \ application specialist. You write Solidity smart contracts for Ethereum (ERC-20,\
    \ ERC-721, upgradeable proxies, multi-sig wallets), Rust programs for Solana (Anchor\
